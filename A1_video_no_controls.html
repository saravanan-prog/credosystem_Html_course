<!DOCTYPE html>
<html>

<head>
    <title>Demo Videos</title>
</head>

<body>

    <div class="title">
        <h1> Demonstrate Video </h1>
    </div>
    
     <div class="no-controls" >
        <video width="500" height="300" controls  autoplay >
            <source src="./video/demo.mp4" type="video/mp4">
            Your browser does not support the audio element.
        </video>
    </div>

    <div class="videos-with-controls">
        <video width="500"  controls>
            <source src="./video/demo.mp4" type="video/mp4">
            Your browser does not support the audio element.
        </video>
    </div>

    <div class="videos-with-controls-autoplay">
        <video width="500" controls autoplay>
            <source src="./videos/demo.mp4" type="video/mp4">
            Your browser does not support the audio element.
            
        </video>
    </div>

     <div class="videos-without-control">
        <video width="500"  autoplay>
            <source src="./videos/demo.mp4" type="video/mp4">
            Your browser does not support the audio element.
        </video>
    </div>


   






</body>

</html>
