<!DOCTYPE html>
<html>
<head>
    
    <title>Input Types</title>
   
</head>
<body>
        <div>
            <label for="canidatename">Candidate Name</label>
             <input 
                type ="text"
                name = "candidate-name"
                id="canidatename"
                placeholder="Ex:saravanan"
                value=""
               
             />
        </div>








        <div>
            <label for="credital">password</label>
            <input 
                type="password"
                name="password"
                id="credital"
                value =""
            />
        </div>







        <div>
            <label for="candidate-email">Email</label>
            <input 
                type="email"
                name="candidate-email"
                id="candidate-email"
                value =""
            />
        </div>






        <div>
            <label for="date-of-brith">dob</label>
            <input 
                type="date"
                name="sample-text"
                id="date-of-brith"
                max="2026-07-04"
               
            />
        </div>





         <div>
            <label for="addate-time">
                Admission Date
            </label>
            <input 
                type="datetime-local"
                name="sample-text"
                id="addate-time"

            />
        </div>


        <div>
            <label for="candidate-age">Number</label>
            <input 
                type="number"
                name="candidate-age"
                id="candidate-age"
            />
        </div>








        

         <div>
            <label for="">Tel</label>
            <input 
                type="tel"
                name="sample-text"
                id=""
                pattern="[0-9]{6-10}"
                
            />
        </div>




         <div>
            <label for="acp">Accept Terms conditions</label>
            <input 
                type="checkbox"
                name="sample-text"
                id="acp"
                value="true"
            /> All legeal documents is submitted as per nors
        </div>








        <div>
            <label for="">check box auto checked</label>
            <input 
                type="checkbox"
                name="sample-text"
                id=""
                value="tamil"
                checked
            /> Tamil
        </div>




       
        <div>
            <label for="gender">Gender</label>
            <input 
                type="radio"
                name="gender"
                id="gender"
                value="male"
                checked
            /> male
        </div>




         <div>
            <label for="candidate-proof">file</label>
            <input 
                type="file"
                name="candidate-proof"
              
            /> 
        </div>



         <div class="rich-text-box">
            <label for="address"> Address</label>
            <textarea 
                    name="address" 
                    id="address" 
                    rows ="4"
                    cols = "30"
            ></textarea>
        </div>









        <div class="select-box">

            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="">choose country</option>
                <option value="india">India</option>
                <option value="china">China</option>
            </select>

        </div>














        <div>
             <!--normal buttons-->
            <input type="submit" value="Register"/>
            <input type="button" value="cancel" />
            <!--semantic buttons-->
            <button type="submit">Register</button>
            <button>Cancel</button>

        </div>





       
       

        

</body>
</html>
