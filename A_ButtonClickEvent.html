<!DOCTYPE html>
<html>

<head>
    <title>Click Event</title>
</head>

<body>

    <div>
        <h3>Click Events</h3>

        <button 
            id="button1" 
            classs="button1" 
            style="color:white;background-color: red;"
            onclick="console.log('Hello Saravanan !!! ')">
            button 1
        </button>
    </div>

    <div>
        <button 
            id="button2" 
            class="button2" 
            style="background-color: blue;color:white;"
            onclick="console.log('Hello Ramesh !!! ')" 
            ondblclick="console.log('what you want Ramesh ?')">
            button 2
        </button>
    </div>


</body>

</html>
