<!DOCTYPE html>
<html>
    <head>
        <title>Table Example</title>
    </head>
    <body>
       <div>
            <table border="2">
                <caption> Studnet Mark List </caption>
                <thead>
                    <tr>
                        <th>Sno</th>
                        <th>Canidate Name </th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>

                    <tr>
                        <td> 1 </td>
                        <td> Saravanan </td>
                        <td > Pass </td>
                    </tr>
                    <tr>
                        <td> 2 </td>
                        <td> Vimal </td>
                        <td> Pass </td>
                    </tr>
                    <tr>
                        <td> 3 </td>
                        <td> Rajesh </td>
                        <td> Fail </td>
                    </tr>

                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">Powered By annauniversity.com</td>
                       
                    </tr>
                </tfoot>
            </table>
       </div>

       <div>
          <table border="2">
             <caption>Welcome to YDMART store</caption>
             <thead>
                <tr>
                    <th>Product No</th>
                    <th>Product Name</th>
                    <th>Price</th>
                </tr>
             </thead>
             <tbody>
                <tr>
                    <td>22115</td>
                    <td>Basmathi Rice</td>
                    <td>Rs.150</td>
                </tr>
                 <tr>
                    <td>22118</td>
                    <td>Dhall</td>
                    <td>Rs.180</td>
                </tr>
             </tbody>
             <tfoot>
                <tr>
                    <th colspan="2">Gross total</th>
                    <th>330</th>
                </tr>
                <tr>
                    <th colspan="2">CGST</th>
                    <th>15.12</th>
                </tr>
                 <tr>
                    <th colspan="2">SGST</th>
                    <th>15.25</th>
                </tr>
                <tr>
                    <th colspan="2">Total</th>
                    <th>360.37</th>
                </tr>
                 <tr>
                    <th colspan="2">Round-off</th>
                    <th>361</th>
                </tr>
             </tfoot>
          </table>
       </div>
    </body>
</html>
