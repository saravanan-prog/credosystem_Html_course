<!DOCTYPE html>
<html>
    <head>
        <title>Table Example</title>
    </head>
    <body>
        
        <div class="simple-item-list">
            <h1>Simple Table</h1>

            <table border="2" align="center">
                <thead style="color:green">
                    <tr>
                        <th colspan="4">Welcome to DMART</th>
                    </tr>
                    <tr>
                        <th>Sno</th>
                        <th>Item</th>
                        <th>Qty</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>dholl</td>
                        <td>1kg</td>
                        <td>120</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td rowspan="2">Sivaji Rice</td>
                        <td>I bag</td>
                        <td>500</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <!-- <td>Sivaji Rice</td> -->
                        <td>1Bag</td>
                        <td>600</td>
                    </tr>
                </tbody>
                <tfoot style="color:red">
                    <tr>
                        <th colspan="3">CGST</th>
                        <td>25</td>
                        
                    </tr>
                    <tr>
                        <th colspan="3">SGST</th>
                         <td>25</td>
                        
                    </tr>
                    <tr>
                        <th colspan="3">Total</th>
                        <th>1270</th>
                    </tr>
                </tfoot>
               
            </table>






        </div>




    </body>
</html>
