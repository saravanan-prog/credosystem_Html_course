<!DOCTYPE html>
<html>
<head>
   
    <title>HTML ForMS</title>

</head>
<body>
    <div class="title">
        <h1>Student Registration Form </h1>
    </div>

    <div class="student-form">
        
        <form>
            <div class="row">
                <label for="student-name">Student Name </label>
                <input type="text" id="student-name"  class="form-control" name="student-name" value="Abinaya">
            </div>

            <div class="row">
                <label for="credential">Password</label>
                <input type="password" id="credential" class="form-control" name="student-password"
                value="Test@123"
                >
            </div>
            <div class="row">
                <input type="submit" value="register"/>
                <input type="button" value = "cancel" />
            </div>

        </form>






    </div>
   
</body>
</html>
