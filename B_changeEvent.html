<!DOCTYPE html>
<html>

<head>
    <title>Change Event</title>
</head>
<body>

    <input 
        type="text" 
        name = "candidatename"
        class = "txt-clr-red txt-cntr"
        id = "candidatename"
        onchange = "console.log('input event ====>',event.target.value)"
   >

    <select onchange="console.log('select box ====>',event.target.value)">
        <option value="apple">Apple</option>
        <option value="orange">Orange</option>
        <option value="grapes">Grapes</option>
    </select>


</body>
</html>
