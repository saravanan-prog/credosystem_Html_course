<!DOCTYPE html>
<html>

<head>
    <title>Key board  Event</title>
</head>

<body>
    <div>
        <h1> keypress </h1>
        <textarea 
            name="text-area" 
            id="" 
            onkeypress = "console.log('Typing....',event.target.value)"
        ></textarea>
    </div>
    <div>
        <label>Name:</label>
        <input type="text" onchange = "console.log(event.target.value)">
    </div>     
</body>
</html>
