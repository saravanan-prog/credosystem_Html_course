<!doctype html>
<html>

<head>
  <title>Basic Form</title>
</head>

<body>
  <div>
    <form method="post" enctype="multipart/form-data">
      <div>
        <label for="canidate-name">Enter your Name</label>
        <input type="text" id="canidate-name" name="candidatename" />
      </div>
      <div>
        <label for="canidate-password">Enter your password</label>
        <input type="password" id="canidate-password" name="canidate-password">
      </div>
      <div>
        <label for="canidate-dob">Enter your Date of Birth</label>
        <input type="date" id="canidate-dob" name="canidate-dob" max="2026-08-29">
      </div>
      <div>
        <label for="id-proof">Enter your Date of Birth</label>
        <input type="file" id="id-proof" name="proof">
      </div>
      <div>
        <button type="submit">Register</button>
        <button>Cancel</button>
      </div>
    </form>
  </div>
</body>
</html>
