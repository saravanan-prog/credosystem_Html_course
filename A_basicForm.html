<!doctype html>
<html>
  <head>
    <title>Basic Form</title>
  </head>
  <body>
    <form
      method="POST"
      onsubmit="
        event.preventDefault();
        console.log('event=====>', event);
      "
    >
      <div>
        <label for="candidate-name">Candidate Name</label>
        <input
          type="text"
          id="candidate-name"
          name="candidatename"
          value="Ramesh"
        />
      </div>
      <div>
        <label for="candidate-email">Candidate Email</label>
        <input
          type="email"
          id="candidate-email"
          name="candidateemail"
          value="ramesh.r2@gmail.com"
        />
      </div>
      <div>
        <label for="candidate-password">Password</label>
        <input
          type="password"
          id="candidate-password"
          name="candidatepassword"
        />
      </div>
      <div>
        <button type="submit">Registration</button>
      </div>
    </form>
  </body>
</html>
