<!DOCTYPE html>
<html>

<head>

    <title>Basic Form</title>

</head>

<body>
    <form method="POST" enctype="multipart/form-data">
        <div>
            <label for="candidateName">
                <span>Candidate Name</span> 
                <span style="color:red">*</span>

            </label>
            <input type="text" id="canidateName" name="canidateName" />
        </div>
        <div>
            <label for="canidateEmail">Canidate Email</label>
            <input type="email" id="canidateEmail" name="canidateEmail" />
        </div>

        <div>
            <label for="phone">Tel</label>
            <input type="tel" id="phone" name="phone" />
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
        </div>

         <div>
            <label for="canidateage">Canidate Age</label>
            <input type="number" id="canidateage" name="canidateage" />
        </div>

        <div>
            <label for="dateofbirth">Canidate Age</label>
            <input type="date" id="dateofbirth" name="dateofbirth" />
        </div>

        <div>
            <label for="gender">Gender</label>
            <span>
                <input type="radio" id="male" name="gender">
                <label for="Male">Male</label>
            </span>
             <span>
                <input type="radio" id="female" name="gender">
                <label for="Female">Female</label>
            </span>
        </div>

        <div>
            <label>Languages</label> 
            <span>
                <input type="checkbox" name="lang[]" value="tamil">
                <label for="Tamil"> Tamil </label>
            </span>

             <span>
                <input type="checkbox" name="lang[]" value="english">
                <label for="english"> english </label>
            </span>

              <span>
                <input type="checkbox" name="lang[]" value="malayalam">
                <label for="Malayalam"> Malayalam </label>
            </span>
        </div>

        <div>
            <label for="profilephoto"> Profile pic </label>
            <input type="file" id="profilephoto" name="profile-pic">
        </div>

        <div>
            <label for="">Comments</label>
            <textarea name="" id="" rows="5" cols="15"></textarea>
        </div>

        <div>
            <label for="country">Country</label>
            <select id="country" name="country">
                 <option> Please choose your country </option>
                <option value="india"> India </option>
                <option value="china"> China </option>
                <option value="bangladesh"> Bangladesh </option>
            </select>
        </div>

        <div>
            <button type="submit"> Submit </button>
        </div>
    </form>
</body>

</html>
