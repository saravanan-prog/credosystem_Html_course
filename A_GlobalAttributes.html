<!DOCTYPE html>
<html>
    <head>
        <title>Global Attributes</title>
    </head>
    <body>
        <!--ID - unique -->
        <p id="welcome-msg">Hello Welcome to HTML world</p>
        <h1 id="h1-welcome-msg">Hello CSS world</h1>
        <div id="container">I am container </div>


        <!-- Class - Not-unique -->
         <p class="text-white text-bg-red">I am class Attributes</p>
         <h1 class="bg-pink text-white">I am a class attributes </h1>

        
        <!-- style -  inline-css -->
         <p style="color:white;background-color: tomoto;"> Hello Style attribute </p>
         <h1 style="color:white;background-color: pink;">I am style Attribute</h1>

        <!--title - abservation tooltip-->
        <p> <span title="TATA Consultancy Services">TCS</span> is No1. Service based Company</p>


        <!--contenteditable true/false -->
        <p contenteditable="true"> Hello My self saravanan </p>

        
        <!--hidden attribute-->
        <p hidden>I am Software developer in chennai top of the city</p>





    </body>
</html>
