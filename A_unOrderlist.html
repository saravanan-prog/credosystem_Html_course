<!DOCTYPE html>
<html>

<head>

    <title>Un Order List Example</title>

</head>

<body>
    <h1> Un order List Example</h1>
    
    <div class="fruitList">

        <ul id="fruits" class="fruits" >
            <li>Apple </li>
            <li>Orange </li>
            <li>Grapes </li>
        </ul>

        <ul id="fruits" class="fruits" type="disc">
            <li>Apple </li>
            <li>Orange </li>
            <li>Grapes </li>
        </ul>


        <ul id="fruits" class="fruits" type="circle">
            <li>Apple </li>
            <li>Orange </li>
            <li>Grapes </li>
        </ul>

        <ul id="fruits" class="fruits" type="square">
            <li>Apple </li>
            <li>Orange </li>
            <li>Grapes </li>
        </ul>

    </div>






</body>

</html>
