<!DOCTYPE html>
<html>
<head>

    <title>Un Order List Example</title>

</head>

<body>

    <div>
        <h1> Fruit List </h1>
        <ul>
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
            <li>Pine apple</li>
        </ul>
    </div>

     <div>
        <h1> Fruit List - circle </h1>
        <ul type="circle">
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
            <li>Pine apple</li>
        </ul>

    </div>

    <div>
        <h1> Fruit List - Square </h1>
        <ul type="Square">
            <li>Apple</li>
            <li>Orange</li>
            <li>Grapes</li>
            <li>Pine apple</li>
        </ul>
    </div>

    

</body>
</html>
