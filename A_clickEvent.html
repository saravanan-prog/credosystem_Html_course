<!DOCTYPE html>
<html>

<head>
    <title>Click Event</title>
</head>

<body>

    <div>
        <h3> Single Click Events</h3>

        <button 
            onclick = "console.log('Hello Saravanan !!! ')"
         >
            button 1
        </button>
    </div>

    <div>
        <h3>Double Click Events</h3>
        <button 
            ondblclick = "console.log('what you want Ramesh ?')" 
        >
            button 2
        </button>
    </div>


</body>

</html>
