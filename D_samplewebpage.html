<html>
  <head>
    <title>Header Section</title>
  </head>
  <body>
    <header>
      <figure>
        <img
          src="./Images/collegeLogo.jpg"
          alt="site-logo"
          height="50"
          width="50"
        />
      </figure>
      <nav>
        <ul>
          <li><a href="#">home</a></li>
          <li><a href="#">about</a></li>
          <li><a href="#">blog</a></li>
          <li><a href="#">contact</a></li>
        </ul>
      </nav>
    </header>
   <main>
      <aside>side-bar</aside>
      <article>
        <section>
          <h2>Employee Information</h2>
          <table>
            <thead>
              <tr>
                <th>Sno</th>
                <th>Emp name</th>
                <th>Emp Salary</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Ramesh</td>
                <td>5000</td>
              </tr>
              <tr>
                <td>2</td>
                <td>Suresh</td>
                <td>8000</td>
              </tr>
            </tbody>
          </table>
        </section>
        <section>
          <h3>Employee Form</h3>
          <form>
            <div>
              <label for="">Employee Name</label>
              <input type="text" id="empname" name="empname" />
            </div>
            <div>
              <label for="">Employee Salary</label>
              <input type="text" id="empsalary" name="empsalary" />
            </div>
            <div><button type="submit">ADD</button></div>
          </form>
        </section>
      </article>
    </main>
    <footer>
      <section>
        <h3>Footer section</h3>
      </section>

      <nav>
        <ul>
          <li><a href="#">Facebook</a></li>
          <li><a href="#">Instagram</a></li>
          <li><a href="#">Twitter</a></li>
          <li><a href="#">Telegram</a></li>
        </ul>
      </nav>
        <p>&copy; 2022 Saravanan Corp. All rights reserved.</p>
      
    </footer>
  </body>
</html>
